<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Pengguna (Realtime Firebase)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase JS SDK (v8 Compat Version - Paling Mudah Untuk HTML) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-users text-blue-600 mr-2"></i>Sistem Data Pengguna</h1>
                <p class="text-slate-500 text-sm mt-1">Data tersinkron secara automatik antara Komputer A & B.</p>
            </div>
            <div id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">
                <i class="fa-solid fa-spinner fa-spin mr-1"></i> Menyambung ke Firebase...
            </div>
        </div>

        <!-- Form Tambah User -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2"><i class="fa-solid fa-user-plus text-green-500 mr-2"></i>Tambah Pengguna Baru</h2>
            <form id="userForm" onsubmit="saveUser(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pengguna</label>
                    <input type="text" id="username" required placeholder="Contoh: Ahmad" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Peranan (Role)</label>
                    <select id="userRole" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Staff">Staff</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Cipta User Baru
                    </button>
                </div>
            </form>
        </div>

        <!-- Senarai User -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2"><i class="fa-solid fa-list text-purple-500 mr-2"></i>Senarai Pengguna Didaftarkan</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 border-b">
                            <th class="p-3">ID / Key</th>
                            <th class="p-3">Nama</th>
                            <th class="p-3">Peranan</th>
                            <th class="p-3 text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="4" class="text-center p-6 text-slate-400">
                                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
                                <p>Memuat turun data...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- LOGIK JAVASCRIPT & FIREBASE -->
    <script>
        // =========================================================================
        // 1. TAMPAL KOD CONFIG FIREBASE ANDA DI SINI
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAI-q-kJ6CfG_j6eN-t0yIQXi7pL5cyG3c",
            authDomain: "sistem-database-app.firebaseapp.com",
            projectId: "sistem-database-app",
            storageBucket: "sistem-database-app.firebasestorage.app",
            messagingSenderId: "653561563988",
            appId: "1:653561563988:web:a53467c1e7654c3a7256c1",
            measurementId: "G-GL4N801YSD"
        };

        // =========================================================================
        // 2. INITIALIZE FIREBASE
        // =========================================================================
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            // Semak status sambungan
            const statusBadge = document.getElementById('status-badge');
            statusBadge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800";
            statusBadge.innerHTML = '<i class="fa-solid fa-wifi mr-1"></i> Tersambung ke Firebase (Cloud)';
        } catch (error) {
            console.error("Ralat Firebase Config:", error);
            const statusBadge = document.getElementById('status-badge');
            statusBadge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800";
            statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal Sambung (Sila Masukkan Config)';
        }

        // Reference ke 'users' node dalam database
        const usersRef = db.ref('users');

        // =========================================================================
        // 3. TAMBAH USER BARU KE CLOUD DATABASE
        // =========================================================================
        function saveUser(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username');
            const userRoleInput = document.getElementById('userRole');

            const newUserData = {
                username: usernameInput.value.trim(),
                role: userRoleInput.value,
                created_at: new Date().toISOString()
            };

            // Simpan ke Firebase (Guna .push() untuk auto-generate ID unik)
            usersRef.push(newUserData)
                .then(() => {
                    usernameInput.value = '';
                    alert('User baru berjaya dicipta di Cloud Database!');
                })
                .catch((error) => {
                    alert('Ralat semasa menyimpan: ' + error.message);
                });
        }

        // =========================================================================
        // 4. BACA & DENGAR PERUBAHAN DATA secara REAL-TIME
        // =========================================================================
        // Fungsi .on('value') akan berjalan setiap kali data berubah di Komputer A / B
        usersRef.on('value', (snapshot) => {
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = '';

            const data = snapshot.val();

            if (!data) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center p-6 text-slate-400">Tiada rekod pengguna dijumpai.</td>
                    </tr>
                `;
                return;
            }

            // Loop semua data pengguna dari Firebase
            Object.keys(data).forEach((key) => {
                const user = data[key];
                const row = document.createElement('tr');
                row.className = "border-b hover:bg-slate-50 transition";
                
                row.innerHTML = `
                    <td class="p-3 text-xs font-mono text-slate-400">${key.substring(0, 8)}...</td>
                    <td class="p-3 font-semibold text-slate-800">${escapeHtml(user.username)}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 text-xs rounded-full font-medium ${user.role === 'Admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                            ${user.role}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="deleteUser('${key}')" class="text-red-500 hover:text-red-700 p-1.5 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        });

        // =========================================================================
        // 5. PADAM USER DARI CLOUD
        // =========================================================================
        function deleteUser(key) {
            if (confirm("Adakah anda pasti mahu memadam user ini?")) {
                db.ref('users/' + key).remove()
                    .catch((error) => {
                        alert("Gagal memadam: " + error.message);
                    });
            }
        }

        // Helper untuk keselamatan (mencegah XSS)
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
